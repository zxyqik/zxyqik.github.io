<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- копия telegram.org/js/telegram-web-app.js: telegram.org в России замедляют, а со своего сервера игра открывается сразу (обновить: npm run tg:update) -->
<script src="js/telegram-web-app.js"></script>
<title>Финансовый ход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;600;700&display=swap">
<style>
/* Минимализм в духе Telegram: системный шрифт, цвета темы Telegram, родная нижняя кнопка.
   Герой — номер, набранный моноширинным шрифтом внутри тонкого контура SIM.
   Контур дорисовывается, пока крутятся цифры, и окрашивается в цвет редкости. */
:root {
  --bg: #FFFFFF;
  --bg-2: #F1F2F4;
  --text: #0D0F11;
  --hint: #8A9096;
  --line: rgba(13, 15, 17, 0.12);
  --accent: #1DAA5C;
  --accent-ink: #FFFFFF;
  --danger: #D2301F;
  /* цвета редкостей: обычный — цвет текста */
  --c1: #189A4C; --c2: #1D6FD0; --c3: #7038DA; --c4: #C08A00; --c5: #D2301F;
  --sx-a: #0D0F11; --sx-b: #9AA0A6;
  --ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', 'Segoe UI', 'Helvetica Neue', sans-serif;
  --mono: 'Martian Mono', ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101214; --bg-2: #1B1E21; --text: #F1F3F4; --hint: #8B9298; --line: rgba(241, 243, 244, 0.14);
    --accent: #33CF7C; --accent-ink: #04140A;
    --danger: #FF6A55;
    --c1: #3DD27F; --c2: #4FA6FF; --c3: #A784FF; --c4: #F2BE3A; --c5: #FF5A48;
    --sx-a: #FFFFFF; --sx-b: #5E656B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101214; --bg-2: #1B1E21; --text: #F1F3F4; --hint: #8B9298; --line: rgba(241, 243, 244, 0.14);
  --accent: #33CF7C; --accent-ink: #04140A;
  --danger: #FF6A55;
  --c1: #3DD27F; --c2: #4FA6FF; --c3: #A784FF; --c4: #F2BE3A; --c5: #FF5A48;
  --sx-a: #FFFFFF; --sx-b: #5E656B;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--ui); font-size: 15px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.app {
  height: 100%; max-width: 460px; margin: 0 auto;
  padding-inline: 16px; padding-block: calc(10px + var(--tg-content-safe-area-inset-top, 0px)) 12px;
  display: flex; flex-direction: column;
}

/* ---------- верх ---------- */
.top { display: flex; align-items: center; gap: 8px; height: 44px; }
.ghost {
  height: 36px; padding: 0 12px; border-radius: 18px; background: var(--bg-2);
  display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px;
  transition: transform .15s;
}
.ghost:active { transform: scale(.96); }
.ghost.round { width: 36px; padding: 0; justify-content: center; position: relative; }
.ghost .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg-2); }
.chip-tx { max-width: 46vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#countryBtn { min-width: 0; }
.flag { width: 20px; height: 14px; border-radius: 3px; overflow: hidden; display: block; flex: none; box-shadow: 0 0 0 .5px var(--line); }
.caret { color: var(--hint); }
.wallet { margin-left: auto; text-align: right; line-height: 1.15; }
.wallet .mono { display: block; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
.wallet small { color: var(--hint); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.xp { width: 34px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; display: inline-block; }
.xp i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .6s ease; }
.wallet.up .mono { animation: up .8s ease; }
@keyframes up { 30% { color: var(--accent); } }

/* ---------- SIM-контур ---------- */
.hero { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.sim { position: relative; width: 100%; aspect-ratio: 85.6 / 54; container-type: inline-size; }
.sim svg.outline { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.outline .base { fill: var(--sim-fill, transparent); stroke: var(--line); stroke-width: 1.25; transition: fill .8s ease; }
.outline .run { fill: none; stroke: var(--sim-c, var(--text)); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 1; transition: stroke .6s ease, opacity .6s ease; }

.sim-in { position: absolute; inset: 0; padding: 6.4cqw 6.4cqw 6cqw; display: flex; flex-direction: column; }
.sim-head { display: flex; align-items: flex-start; justify-content: space-between; }
.op { display: flex; flex-direction: column; gap: 1.6cqw; min-width: 0; }
.op-row { display: flex; align-items: center; gap: 2.2cqw; min-width: 0; }
.op b { font-weight: 600; font-size: 4.8cqw; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op small { font-family: var(--mono); font-size: 2.5cqw; color: var(--hint); letter-spacing: .04em; }
.chip { width: 12.5cqw; margin-right: 15cqw; margin-top: .4cqw; color: var(--hint); }
.chip svg { display: block; width: 100%; height: auto; }
.sim-num { margin-top: auto; display: flex; flex-direction: column; gap: 1.6cqw; }
.cc { font-family: var(--mono); font-size: 3.9cqw; color: var(--hint); letter-spacing: .02em; }
.digits { display: flex; align-items: flex-end; font-family: var(--mono); font-weight: 600; font-size: 11.6cqw; line-height: 1; letter-spacing: 0; }
.sep { display: none; position: relative; height: 1.2em; flex: none; }
.sep.bar { display: block; width: .62ch; }
.sep.bar::before { content: ''; position: absolute; left: 18%; right: 18%; top: 56%; height: .075em; border-radius: 2px; background: var(--hint); }
.sep.gap { display: block; width: .36ch; }

.logo { width: 7.4cqw; height: 7.4cqw; display: grid; place-items: center; flex: none; border-radius: 26%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.logo.ci { border-radius: 50%; }
.logo.bare { box-shadow: none; }
.logo svg { width: 64%; height: 64%; display: block; }
.logo.bare svg { width: 100%; height: 100%; }
.logo.sm { width: 18px; height: 18px; border-radius: 5px; }
.logo.sm.ci { border-radius: 50%; }
.logo.md { width: 30px; height: 30px; border-radius: 8px; }
.logo.md.ci { border-radius: 50%; }
.reel { position: relative; width: 1ch; height: 1.2em; overflow: hidden; }
.fl { position: absolute; inset: .07em .02em; border-radius: .09em; display: grid; place-items: center; overflow: hidden; transition: opacity .35s ease, background-color .3s ease; }
.fl::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--bg); opacity: 0; transition: opacity .3s ease; }
.digits.flapping .fl { background: color-mix(in srgb, var(--text) 9%, transparent); }
.digits.flapping .fl::after { opacity: 1; }
.fd { display: block; line-height: 1.06em; transform-origin: 50% 50%; will-change: transform; }
.final { display: block; height: 1.2em; line-height: 1.2em; text-align: center; }
.final { position: absolute; inset: 0; opacity: 0; transition: opacity .38s ease; }
.reel.on .fl { opacity: 0; }
.reel.on .final { opacity: 1; }
.reel.clunk { animation: clunk .2s ease-out; }
@keyframes clunk { 40% { transform: translateY(.04em); } }
.digits.idle .fd { color: var(--line); }
.digits.dim { opacity: .3; transition: opacity .5s; }
.uline { position: absolute; left: 6%; right: 6%; bottom: .05em; height: 2px; border-radius: 2px; background: var(--hint); opacity: .5; transform: scaleX(0); transition: transform .4s cubic-bezier(.2,.8,.2,1); }
.uline.on { transform: scaleX(1); }

/* ---------- редкости: цвет «интерфейса» номера ---------- */
.sim[data-tier="0"] .run { opacity: 0; }
.sim[data-tier="1"] { --sim-c: var(--c1); --sim-fill: color-mix(in srgb, var(--c1) 6%, transparent); }
.sim[data-tier="2"] { --sim-c: var(--c2); --sim-fill: color-mix(in srgb, var(--c2) 6%, transparent); }
.sim[data-tier="3"] { --sim-c: var(--c3); --sim-fill: color-mix(in srgb, var(--c3) 7%, transparent); }
.sim[data-tier="4"] { --sim-c: var(--c4); --sim-fill: color-mix(in srgb, var(--c4) 8%, transparent); }
.sim[data-tier="5"] { --sim-c: url(#mythG); --sim-fill: color-mix(in srgb, var(--c5) 8%, transparent); }
.sim[data-tier="6"] { --sim-c: url(#secretG); --sim-fill: color-mix(in srgb, var(--sx-b) 10%, transparent); }
.final.t1, .tc1 { color: var(--c1); }
.final.t2, .tc2 { color: var(--c2); }
.final.t3, .tc3 { color: var(--c3); }
.tc0 { color: var(--text); }
.final.t4, .final.t5, .final.t6, .tc4, .tc5, .tc6 { -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.final.t4, .tc4 { background-image: linear-gradient(100deg, var(--c4) 0%, var(--c4) 35%, #FFF2C4 48%, var(--c4) 62%, var(--c4) 100%); background-size: 260% 100%; background-position: 100% 0; }
.tc4 { background-position: 0 0; }
.reel.on .final.t4 { animation: shine 1.5s cubic-bezier(.3,.6,.2,1) both; animation-delay: var(--d, 0ms); }
.final.t5, .tc5 { background-image: linear-gradient(100deg, var(--c5), #FF9A3C, #B3122A, var(--c5), #FF9A3C); background-size: 300% 100%; animation: flow 2.6s linear infinite; }
.final.t6, .tc6 { background-image: linear-gradient(100deg, var(--sx-a), var(--sx-b), var(--sx-a), var(--sx-b), var(--sx-a)); background-size: 300% 100%; animation: flow 3.4s linear infinite; }
@keyframes flow { to { background-position: -300% 0; } }
.digits[data-tier="1"] .uline { background: var(--c1); opacity: 1; }
.digits[data-tier="2"] .uline { background: var(--c2); opacity: 1; }
.digits[data-tier="3"] .uline { background: var(--c3); opacity: 1; }
.digits[data-tier="4"] .uline { background: var(--c4); opacity: 1; }
.digits[data-tier="5"] .uline { background: linear-gradient(90deg, var(--c5), #FF9A3C, var(--c5)); opacity: 1; }
.digits[data-tier="6"] .uline { background: linear-gradient(90deg, var(--sx-a), var(--sx-b), var(--sx-a)); opacity: 1; }
.td.tc0 i { background: var(--hint); }
.td.tc4, .td.tc5, .td.tc6 { background: none; animation: none; }
.td.tc4 { -webkit-text-fill-color: var(--c4); color: var(--c4); }
.td.tc5 { -webkit-text-fill-color: var(--c5); color: var(--c5); }
.td.tc6 { -webkit-text-fill-color: var(--sx-b); color: var(--sx-b); }
.td.tc4 i, .td.tc5 i, .td.tc6 i { background: currentColor; }
.fchip.on .td { -webkit-text-fill-color: currentColor; }
.ncard.tier1, .scard.tier1 { border-color: var(--c1); } .ncard.tier2, .scard.tier2 { border-color: var(--c2); }
.ncard.tier3, .scard.tier3 { border-color: var(--c3); } .ncard.tier4, .scard.tier4 { border-color: var(--c4); }
.ncard.tier5, .scard.tier5 { border-color: var(--c5); } .ncard.tier6, .scard.tier6 { border-color: var(--sx-b); }
@keyframes shine { from { background-position: 100% 0; } to { background-position: 0% 0; } }

/* ---------- результат ---------- */
.result { position: relative; height: 150px; }
.result > div {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-start;
  opacity: 0; transform: translateY(6px); pointer-events: none;
  transition: opacity .3s ease, transform .4s cubic-bezier(.2,.8,.2,1);
}
.result[data-state="intro"] .r-intro, .result[data-state="spin"] .r-spin,
.result[data-state="main"] .r-main, .result[data-state="sold"] .r-sold, .result[data-state="batch"] .r-batch { opacity: 1; transform: none; pointer-events: auto; }
.td { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
.td i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.r-intro { gap: 6px; }
.r-intro b { font-size: 17px; font-weight: 600; }
.r-intro span { color: var(--hint); max-width: 34ch; }
.r-spin { color: var(--hint); }
.label { color: var(--hint); font-size: 13px; }
.est { font-family: var(--mono); font-size: 34px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.2; white-space: nowrap; }
.meta { color: var(--hint); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; }
.meta b { color: var(--text); font-weight: 600; }
.meta button { color: var(--text); font-weight: 600; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: auto; }
.btn { height: 46px; border-radius: 14px; background: var(--bg-2); font-weight: 600; font-size: 15px; transition: transform .15s, background-color .2s, color .2s; }
.btn:active { transform: scale(.97); }
.btn.confirm { background: var(--text); color: var(--bg); }
.r-sold .est { color: var(--accent); }

/* ---------- низ ---------- */
.qty { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.qty button { height: 34px; border-radius: 10px; background: var(--bg-2); font-family: var(--mono); font-size: 12.5px; font-weight: 600; transition: background-color .15s, color .15s, opacity .15s; }
.qty button { height: 40px; line-height: 1.1; }
.qty small { display: block; font-size: 9.5px; color: var(--accent); font-weight: 600; }
.qty button[aria-checked="true"] { background: var(--text); color: var(--bg); }
.qty button:disabled { opacity: .35; cursor: default; }
.pity { color: var(--hint); font-size: 12px; margin: 10px 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pity .mono { color: var(--text); font-size: 11.5px; }
.main-btn {
  width: 100%; height: 54px; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
  font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .15s, opacity .2s, background-color .2s;
}
.main-btn:active:not(:disabled) { transform: scale(.985); }
.main-btn:disabled { cursor: default; }
.main-btn.wait { opacity: .55; }
.main-btn.alt { background: var(--bg-2); color: var(--text); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: rot .7s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.in-tg .main-btn { display: none; }
.in-tg .pity { margin-bottom: 0; }

/* ---------- шторка ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); opacity: 0; transition: opacity .25s; }
.scrim.open { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 460px; margin: 0 auto;
  max-height: 88%; overflow-y: auto; background: var(--bg); border-radius: 16px 16px 0 0;
  padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%); transition: transform .34s cubic-bezier(.2,.85,.2,1);
}
.sheet.open { transform: none; }
.grip { width: 36px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 10px; }
.sheet h2 { font-size: 20px; font-weight: 700; margin: 6px 4px 14px; }
.search { width: 100%; height: 40px; border-radius: 12px; border: 0; background: var(--bg-2); color: var(--text); padding: 0 14px; font: inherit; font-size: 15px; outline: none; margin-bottom: 4px; }
.search:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
.sheet-sub .logo.sm { display: inline-grid; vertical-align: -3px; width: 16px; height: 16px; }
.sheet-sub .flag { display: inline-block; height: 11px; width: 16px; vertical-align: -1px; }
.flag.lg { width: 26px; height: 18px; border-radius: 4px; }
.ops { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; }
.ops span { display: inline-flex; align-items: center; gap: 5px; color: var(--hint); font-size: 12.5px; }
.ops .logo.sm { width: 15px; height: 15px; border-radius: 4px; }
.ops .logo.sm.ci { border-radius: 50%; }
.group-t { color: var(--hint); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 18px 16px 6px; }
.group { background: var(--bg-2); border-radius: 12px; overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 8px 14px; text-align: left;
  position: relative;
}
.row + .row::before { content: ''; position: absolute; top: 0; right: 0; left: 56px; height: .5px; background: var(--line); }
.group.flat .row + .row::before { left: 14px; }
.row.first::before { display: none; }
.row .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
.row .ic svg { width: 18px; height: 18px; }
.row .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .t small { color: var(--hint); font-size: 13px; }
.row .v { color: var(--hint); font-size: 15px; text-align: right; white-space: nowrap; }
.row .v.mono { font-size: 13px; color: var(--text); }
.row .chev { color: var(--hint); opacity: .7; }
.row .check { color: var(--accent); font-weight: 700; }
.row .take { color: var(--accent); font-weight: 600; }
.switch { width: 50px; height: 30px; border-radius: 30px; background: var(--line); position: relative; flex: none; transition: background-color .2s; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.ver { display: block; margin: 18px auto 0; color: var(--hint); font-size: 12px; opacity: .7; padding: 6px 10px; }
.btn.wide { width: 100%; }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.link-btn { color: var(--danger); font-size: 14px; font-weight: 500; padding: 6px 4px; }
.num-row .t { min-width: 0; }
.num-row .mono { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.num-row.sold { opacity: .45; }
.form { display: flex; flex-direction: column; gap: 14px; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld > span:first-child, .sub-t { color: var(--hint); font-size: 13px; }
.sub-t { margin-top: 6px; text-transform: uppercase; letter-spacing: .04em; }
.inp { width: 100%; height: 42px; border-radius: 12px; border: 0; background: var(--bg-2); color: var(--text); padding: 0 12px; font: inherit; font-size: 15px; outline: none; }
.inp:focus-visible, .pre:focus-within { box-shadow: 0 0 0 2px var(--accent); }
select.inp { appearance: none; -webkit-appearance: none; }
.pre { display: flex; align-items: center; background: var(--bg-2); border-radius: 12px; padding-left: 12px; }
.pre b { font-family: var(--mono); color: var(--hint); }
.pre .inp { background: transparent; box-shadow: none; padding-left: 4px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.sw, .mk, .seg label { position: relative; cursor: pointer; }
.sw input, .mk input, .seg input { position: absolute; opacity: 0; pointer-events: none; }
.sw span { display: block; width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.sw input:checked + span { outline: 2px solid var(--text); outline-offset: 2px; }
.sw input:focus-visible + span, .mk input:focus-visible + span, .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.marks { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.mk span { display: grid; place-items: center; aspect-ratio: 1; border-radius: 10px; background: var(--bg-2); color: var(--text); }
.mk svg { width: 62%; height: 62%; }
.mk input:checked + span { background: var(--text); color: var(--bg); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg span { display: block; padding: 8px 12px; border-radius: 10px; background: var(--bg-2); font-size: 14px; }
.seg.wrap span { font-size: 13px; }
.seg input:checked + span { background: var(--text); color: var(--bg); }
.pv { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line); }

.pv small { color: var(--hint); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.msg { margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.msg .err { color: var(--danger); }
.msg .warn { color: var(--c4); }
/* ---------- страницы ---------- */
.page { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.85,.2,1); overscroll-behavior: contain; }
.page.open { transform: none; }
.page-in { max-width: 460px; margin: 0 auto; padding: calc(10px + var(--tg-content-safe-area-inset-top, 0px)) 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
.ph { display: flex; align-items: center; gap: 10px; height: 44px; margin-bottom: 8px; }
.ph h1 { margin: 0; font-size: 20px; font-weight: 700; }
.sum { color: var(--hint); font-size: 14px; margin: 2px 2px 12px; }
.sum b { color: var(--text); font-weight: 600; font-size: 13.5px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 10px; padding: 0 16px; }
.chips::-webkit-scrollbar { display: none; }
.fchip { flex: none; white-space: nowrap; height: 32px; padding: 0 12px; border-radius: 16px; background: var(--bg-2); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.fchip.on { background: var(--text); color: var(--bg); }
.fchip.on .td { color: inherit; }
.num-row small { display: flex; align-items: center; gap: 6px; }
.num-row small .flag { width: 16px; height: 11px; }
.sortbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--hint); font-size: 13px; margin: 0 2px 10px; }
.seg.small span { padding: 6px 10px; font-size: 13px; }
.lock { color: var(--hint); flex: none; }
.empty { text-align: center; padding: 48px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--hint); }
.empty b { color: var(--text); font-size: 17px; }
.empty .btn { margin-top: 10px; padding: 0 22px; }
.page-foot { position: sticky; bottom: 0; padding: 12px 0 4px; background: linear-gradient(transparent, var(--bg) 30%); text-align: center; }
.page-foot small { color: var(--hint); font-size: 12px; display: block; margin-top: 6px; }
.ncard { border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.nc-head { display: flex; align-items: center; gap: 10px; }
.nc-head .t { display: flex; flex-direction: column; }
.nc-head small { color: var(--hint); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.nc-cc { color: var(--hint); font-size: 13px; margin-top: 6px; }
.nc-num { font-size: clamp(30px, 10vw, 42px); font-weight: 600; letter-spacing: -0.02em; display: flex; flex-wrap: nowrap; }
.nc-num.tc0 { color: var(--text); }
.nd { position: relative; display: inline-block; }
.nd.sel::after { content: ''; position: absolute; left: 8%; right: 8%; bottom: -4px; height: 3px; border-radius: 3px; background: var(--accent); }
.nd.up { animation: flashUp 1.2s ease; } .nd.down { animation: flashDown 1.2s ease; } .nd.none { animation: shake .4s ease; }
@keyframes flashUp { 0% { transform: translateY(-40%); opacity: 0; } 40% { transform: none; opacity: 1; text-shadow: 0 0 18px var(--accent); } }
@keyframes flashDown { 0% { transform: translateY(40%); opacity: 0; } 40% { transform: none; opacity: 1; text-shadow: 0 0 18px var(--danger); } }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.nsep { display: inline-block; color: var(--hint); }
.nprice { display: flex; flex-direction: column; margin: 14px 2px 4px; }
.modbox { background: var(--bg-2); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.modbox .inp { background: var(--bg); }
.mod-sel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mod-to { font-size: 14px; color: var(--hint); }
.mod-to .mono { font-size: 15px; font-weight: 600; }
.mod-to b { color: var(--text); font-weight: 600; }
.odds { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); margin: 10px 0 8px; }
.odds i { display: block; height: 100%; }
.o-up { background: var(--accent); } .o-none { background: var(--hint); opacity: .45; } .o-down { background: var(--danger); }
.odds-l { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--hint); margin-bottom: 12px; }
.odds-l span { display: inline-flex; align-items: center; gap: 6px; }
.odds-l i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.odds-l b { color: var(--text); font-weight: 600; font-family: var(--mono); font-size: 12px; }
.mod-note { color: var(--hint); font-size: 13.5px; margin: 0; }
.mod-out { margin: 0; font-weight: 600; font-size: 14px; }
.mod-out.up { color: var(--accent); } .mod-out.down { color: var(--danger); } .mod-out.none { color: var(--hint); }
.sticky-actions { position: sticky; bottom: 0; padding: 12px 0 4px; background: linear-gradient(transparent, var(--bg) 30%); margin-top: 8px; }
/* склад: виды и выбор */
.ph .sel-btn { margin-left: auto; color: var(--accent); font-weight: 600; font-size: 15px; padding: 8px 4px; }
.sortbar { justify-content: space-between; }
.views { display: flex; gap: 4px; background: var(--bg-2); border-radius: 10px; padding: 3px; }
.vbtn { width: 32px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--hint); }
.vbtn svg { width: 18px; height: 18px; }
.vbtn.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.grp { display: flex; justify-content: space-between; align-items: center; margin: 16px 4px 8px; }
.grp-sum { color: var(--hint); font-size: 12px; }
.pick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; color: var(--accent-ink); background: var(--bg); }
.pick svg { width: 14px; height: 14px; }
.pick.on { background: var(--accent); border-color: var(--accent); }
.pick.off { opacity: .35; }
.num-row.picked { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.tiles-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stile { position: relative; aspect-ratio: 1; border-radius: 14px; background: var(--bg-2); padding: 10px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; overflow: hidden; }
.stile-top { display: flex; align-items: center; justify-content: space-between; }
.stile-num { font-size: clamp(14px, 4.4vw, 18px); font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; }
.stile-num.tc0 { color: var(--text); }
.stile-p { font-size: 11px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stile .pick, .scard .pick { position: absolute; top: 8px; right: 8px; }
.stile.picked, .scard.picked { box-shadow: inset 0 0 0 2px var(--accent); }
.cards-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.scard { position: relative; border-radius: 14px; border: 1.5px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 4px; text-align: left; min-width: 0; }
.scard-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.scard-top b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scard-cc { font-size: 11px; color: var(--hint); margin-top: 6px; }
.scard-num { font-size: clamp(15px, 4.6vw, 19px); font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
.scard-num.tc0 { color: var(--text); }
.scard-p { font-size: 12px; color: var(--hint); }
.sel-foot .sel-links { display: flex; justify-content: center; gap: 18px; margin-bottom: 8px; }
.sel-foot .sel-links button { color: var(--accent); font-size: 14px; font-weight: 600; }
/* страница номера: тап по цифре */

.nd { font: inherit; color: inherit; background: none; border: 0; padding: 0 .02em; border-radius: 8px; cursor: pointer; transform-origin: 50% 50%; isolation: isolate; }
/* подсветка — подложкой, а не фоном самой цифры: фон у редких номеров занят градиентом текста */
.nd::before { content: ''; position: absolute; inset: 0; border-radius: 8px; z-index: -1; transition: background-color .15s ease; }
.nd:hover::before { background: color-mix(in srgb, var(--text) 6%, transparent); }
.nd.sel::before { background: color-mix(in srgb, var(--accent) 16%, transparent); }
/* Градиент редких номеров — на каждой цифре отдельно: на iPhone градиент строки не закрашивает
   цифры-кнопки внутри, и они становились прозрачными. */
.nc-num.tc4, .nc-num.tc5, .nc-num.tc6 { background-image: none; animation: none; color: var(--text); -webkit-text-fill-color: currentColor; }
.nc-num.tc4 .nd, .nc-num.tc4 .nsep, .nc-num.tc5 .nd, .nc-num.tc5 .nsep, .nc-num.tc6 .nd, .nc-num.tc6 .nsep {
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; background-size: 300% 100%; }
.rr-num { display: flex; justify-content: center; align-items: center; gap: 3px; font-size: clamp(26px, 8.4vw, 36px); font-weight: 600; margin: 6px 0 12px; }
.rr-d { font: inherit; color: var(--text); background: var(--bg-2); border: 0; border-radius: 10px; width: 1.12em; height: 1.45em; display: grid; place-items: center; cursor: pointer; transition: background-color .15s ease, transform .15s ease, box-shadow .15s ease; }
.rr-d.sel { background: var(--accent); color: var(--accent-ink); transform: translateY(-3px); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 38%, transparent); }
.rr-d:disabled { cursor: default; }
.rr-sep { color: var(--hint); font-size: .6em; }
.rr-price { display: flex; align-items: baseline; justify-content: center; gap: 8px; color: var(--hint); font-size: 13px; margin-bottom: 12px; }
.rr-price b { font-size: 21px; color: var(--text); font-weight: 700; }
.rr-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.rr-o { border-radius: 12px; background: var(--bg-2); padding: 8px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.rr-o b { font-size: 22px; font-weight: 650; line-height: 1.15; }
.rr-o .dl { font-size: 11px; font-weight: 650; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.rr-o .pp { font-size: 10.5px; color: var(--hint); }
.rr-o.up { background: color-mix(in srgb, var(--c1) 13%, var(--bg-2)); } .rr-o.up .dl { color: var(--c1); }
.rr-o.down .dl { color: var(--danger); }
.rr-o.same .dl, .rr-o.cur .dl { color: var(--hint); }
.rr-o.cur { box-shadow: inset 0 0 0 1.5px var(--line); }
.rr-o.hit { box-shadow: inset 0 0 0 2px var(--accent); animation: hitPop .6s ease; }
@keyframes hitPop { 30% { transform: scale(1.08); } }
.rr-bar { display: flex; height: 8px; border-radius: 6px; overflow: hidden; margin: 14px 0 7px; background: var(--bg-2); }
.rr-bar i { display: block; height: 100%; }
.rr-bar .u, .rr-leg i.u { background: var(--c1); } .rr-bar .s, .rr-leg i.s { background: color-mix(in srgb, var(--hint) 55%, transparent); } .rr-bar .d, .rr-leg i.d { background: var(--danger); }
.rr-leg { display: flex; justify-content: space-between; gap: 6px; font-size: 12.5px; color: var(--hint); margin-bottom: 12px; }
.rr-leg i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.rr-leg b { color: var(--text); }
.rr-res { text-align: center; font-weight: 650; font-size: 15px; margin: 0 0 10px; animation: resIn .3s ease; }
.rr-res.up { color: var(--c1); } .rr-res.down { color: var(--danger); } .rr-res.none { color: var(--hint); }
.nc-num .nd { text-decoration: underline dotted color-mix(in srgb, var(--hint) 70%, transparent); text-underline-offset: .18em; text-decoration-thickness: 2px; }
.nc-num.tc4 .nd, .nc-num.tc4 .nsep { background-image: linear-gradient(100deg, var(--c4) 0%, var(--c4) 35%, #FFF2C4 48%, var(--c4) 62%, var(--c4) 100%); background-size: 260% 100%; background-position: 0 0; }
.nc-num.tc5 .nd, .nc-num.tc5 .nsep { background-image: linear-gradient(100deg, var(--c5), #FF9A3C, #B3122A, var(--c5), #FF9A3C); animation: flow 2.6s linear infinite; }
.nc-num.tc6 .nd, .nc-num.tc6 .nsep { background-image: linear-gradient(100deg, var(--sx-a), var(--sx-b), var(--sx-a), var(--sx-b), var(--sx-a)); animation: flow 3.4s linear infinite; }
.nc-hint { color: var(--hint); font-size: 12.5px; }
.rrbox { background: var(--bg-2); border-radius: 14px; padding: 12px; margin-top: 6px; display: flex; flex-direction: column; gap: 10px; }
.oc-row { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; }
.oc { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: 8px; background: var(--bg); }
.oc b { font-size: 14px; }
.oc i { width: 8px; height: 8px; border-radius: 50%; background: var(--hint); opacity: .5; }
.oc span { font-size: 9px; color: var(--hint); font-family: var(--mono); }
.oc.up i { background: var(--accent); opacity: 1; } .oc.down i { background: var(--danger); opacity: 1; }
.oc.cur { box-shadow: inset 0 0 0 1.5px var(--line); }
.rr-best { font-size: 13px; color: var(--hint); }
.rr-best .mono { font-weight: 600; }
.rrbox .odds-l { margin-bottom: 0; }
.devbox { display: flex; flex-direction: column; gap: 8px; }
.inline { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.inline .btn { padding: 0 14px; height: 42px; }
.inline select + select { grid-column: 2; }
.devbox .inline:nth-child(2) { grid-template-columns: 1fr 1fr; }
.note { color: var(--hint); font-size: 12.5px; margin: 14px 16px 0; }
.sheet-num { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin: 4px 4px 2px; }
.sheet-sub { color: var(--hint); font-size: 13px; margin: 0 4px 14px; }

.toast {
  position: fixed; left: 50%; top: calc(12px + var(--tg-content-safe-area-inset-top, 0px)); z-index: 60;
  transform: translate(-50%, -16px); opacity: 0; pointer-events: none; white-space: nowrap;
  background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 12px; font-size: 14px; font-weight: 500;
  transition: opacity .25s, transform .3s cubic-bezier(.2,.8,.2,1);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- v8: регионы, склад, история, скупщики, апгрейдер, ивенты, праздники ---------- */
.plus, .row .v.plus { color: var(--accent); } .minus { color: var(--danger); }
.td.tc6 { -webkit-text-fill-color: var(--text); color: var(--text); }
.td.tc6 i { background: linear-gradient(135deg, var(--sx-a) 50%, var(--sx-b) 50%); box-shadow: 0 0 0 1px var(--line); }
button.pity { display: block; width: 100%; text-align: left; }
.pity .td { font-size: 11.5px; margin-left: 7px; }
.odds-chip { display: inline-block; padding: 2px 8px; margin-right: 8px; border-radius: 7px; background: var(--bg-2); color: var(--text); font-weight: 650; }
.odds-row .ch { font-weight: 700; font-size: 16px; }
.odds-row .t small b { color: var(--text); font-weight: 600; }
.odds-boost { margin: 2px 0 10px; padding: 9px 12px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--text); font-size: 14px; }
.tava { position: relative; width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; overflow: hidden; }
.tava img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.top-row .rank { width: 26px; }
.top-row.tap { cursor: pointer; }
/* меню плитками */
.mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.mtile { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 2px 10px; border-radius: 18px; background: var(--bg-2); font-size: 12.5px; font-weight: 600; min-width: 0; }
.mtile > span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mt-ic { position: relative; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--c);
  background: color-mix(in srgb, var(--c) 20%, var(--bg)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 35%, transparent); }
.mt-ic svg { width: 22px; height: 22px; }
.mt-badge { position: absolute; top: -6px; right: -8px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--danger); color: #fff; font-style: normal; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg-2); }
.mwide { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.mcard { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 18px; background: var(--bg-2); text-align: left; min-width: 0; }
.mcard .t { display: flex; flex-direction: column; min-width: 0; }
.mcard .t b { font-size: 15px; } .mcard .t small { color: var(--hint); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mcard .mc-ava, .mcard .mc-ic { position: relative; width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; overflow: hidden; }
.mcard .mc-ava img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.mcard .mc-ic { border-radius: 12px; color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--bg)); }
.mcard .mc-ic svg { width: 21px; height: 21px; }
.mcard.gold { background: color-mix(in srgb, #E3A400 14%, var(--bg-2)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, #E3A400 55%, transparent); }
.mcard.gold .mc-ic { color: #C98A00; background: color-mix(in srgb, #E3A400 22%, var(--bg)); }
.wrow .wv { color: #C98A00; font-weight: 650; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.wrow .wv::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
:root[data-theme="dark"] .wrow .wv { color: #F2BE3A; }
/* профиль */
.prof-hero { display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; padding: 6px 0 14px; }
.prof-hero .pava { position: relative; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 34px; font-weight: 700; overflow: hidden; margin-bottom: 8px;
  box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px color-mix(in srgb, var(--accent) 70%, transparent); }
.prof-hero .pava img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.prof-hero b { font-size: 21px; }
.prof-hero span { color: var(--hint); font-size: 14px; }
.prof-hero small { color: var(--hint); font-size: 12.5px; }
.prof-lvl { background: var(--bg-2); border-radius: 16px; padding: 12px 14px; }
.prof-lvl > div:first-child { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.prof-lvl span { color: var(--hint); font-size: 13px; }
.prof-lvl .cap { margin: 0; }
.prof-kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.prof-kpi > div { background: var(--bg-2); border-radius: 14px; padding: 10px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.prof-kpi b { font-size: 16px; }
.prof-kpi span { color: var(--hint); font-size: 12px; }
.prof-card { background: var(--bg-2); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; border: 1.5px solid transparent; }
.prof-card .mono { font-size: 19px; font-weight: 600; }
.prof-card small { color: var(--hint); font-size: 13px; }
.prof-act { margin-top: 16px; }
.top-row .t small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-row .tv { display: flex; flex-direction: column; align-items: flex-end; text-align: right; white-space: nowrap; }
.top-row .tv b { font-size: 15px; font-weight: 700; }
.top-row .tv small { color: var(--hint); font-size: 12px; }
.top-hint { color: var(--hint); font-size: 13.5px; margin: 8px 4px 2px; line-height: 1.35; }

/* сообщения */
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; flex: none; }
.cl-row .t small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.pill { flex: none; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--bg-2); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

.top-row .rank { width: 30px; text-align: center; font-weight: 700; color: var(--hint); flex: none; font-size: 15px; }

#page .tabs { margin-bottom: 4px; }

.row .v.sv { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }

.btn.icon { display: grid; place-items: center; }

/* логотипы: плашка с мягким градиентом и бликом */
.logo { position: relative; overflow: hidden; border-radius: 28%; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.22), inset 0 -1px 1px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.14); }
.logo::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,0) 55%); pointer-events: none; }
.logo svg { position: relative; z-index: 1; width: 66%; height: 66%; filter: drop-shadow(0 .5px .4px rgba(0,0,0,.22)); }

.logo.ci, .logo.sm.ci, .logo.md.ci { border-radius: 50%; }

.logo.bare svg { width: 100%; height: 100%; filter: none; }
.mk span svg { width: 66%; height: 66%; }

/* гирлянда по верху экрана */
#garland { position: fixed; left: 0; right: 0; top: var(--tg-content-safe-area-inset-top, 0px); height: 32px; z-index: 25; pointer-events: none; overflow: hidden; }

/* шапка на логотипе игры */
.hat { position: absolute; pointer-events: none; z-index: 2; }
.hat-newyear { width: 36px; left: -6px; top: -17px; transform: rotate(-16deg); }
.hat-halloween { width: 36px; left: -4px; top: -19px; transform: rotate(-12deg); }
.hat-valentine { width: 17px; right: -7px; top: -7px; animation: beat 1.4s ease-in-out infinite; }
.hat-svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 1px 1px rgba(0,0,0,.18)); }
@keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.18); } 24% { transform: scale(1); } 36% { transform: scale(1.12); } }

/* украшение SIM */
.sim-deco { position: absolute; inset: 0; pointer-events: none; }
.snowcap { position: absolute; left: 3.5%; width: 81%; top: -2.6cqw; height: 4.6cqw; overflow: visible; }
.snowcap path { fill: #FFFFFF; stroke: #C9D8EA; stroke-width: .6; vector-effect: non-scaling-stroke; filter: drop-shadow(0 1px 1.5px rgba(80,120,170,.25)); }

.hearts { position: absolute; right: 4cqw; bottom: 4cqw; width: 18cqw; height: 12cqw; animation: beat 1.6s ease-in-out infinite; transform-origin: 70% 80%; }
@media (prefers-reduced-motion: reduce) { #garland .bulb, .hat-valentine, .hearts { animation: none; } }
.wallet .mono { font-size: clamp(14px, 4.4vw, 17px); }
.brand-tx { font-size: clamp(14px, 4.2vw, 16px); }
@media (max-width: 370px) { .top { gap: 6px; } .brand-mark, .brand-mark .logo { width: 32px; height: 32px; } }
.ops .logo.sm { width: 17px; height: 17px; }

/* ---------- v10: апгрейдер ---------- */
.dial-wrap { position: relative; width: min(268px, 70vw); aspect-ratio: 1; margin: 0 auto 18px; }
.dial { width: 100%; height: 100%; display: block; overflow: visible; }
.dial .ticks line { stroke: var(--line); stroke-width: 1.4; stroke-linecap: round; }
.dial .ticks line.mj { stroke: var(--hint); stroke-width: 2; opacity: .6; }
.dial .track { fill: none; stroke: var(--bg-2); stroke-width: 16; }
.dial .arc { fill: none; stroke: url(#upgArc); stroke-width: 16; stroke-linecap: round; transition: stroke-dasharray .5s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 45%, transparent)); }
.dial .trail { fill: none; stroke: color-mix(in srgb, var(--text) 26%, transparent); stroke-width: 16; stroke-linecap: round; opacity: 0; }
.dial .kb { fill: var(--bg); stroke: var(--text); stroke-width: 2.5; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
.dial .kb-dot { fill: var(--text); transition: fill .3s; }
.dial-wrap.win .kb { stroke: var(--accent); } .dial-wrap.win .kb-dot { fill: var(--accent); }
.dial-wrap.lose .kb { stroke: var(--danger); } .dial-wrap.lose .kb-dot { fill: var(--danger); }
.dial-wrap.win .arc { animation: arcGlow 1.1s ease-out 1; }
@keyframes arcGlow { 40% { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 70%, transparent)); stroke-width: 18; } }
.dial-c { position: absolute; inset: 22%; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--bg-2) 70%, var(--bg)), var(--bg) 70%); }
.dial-c b { font-size: clamp(28px, 9vw, 38px); font-weight: 600; letter-spacing: -0.05em; line-height: 1.1; }
.dial-c span { color: var(--hint); font-size: 13px; margin-top: 2px; }
.dial-wrap.win .dial-c b { color: var(--accent); }
.dial-wrap.lose .dial-c b { color: var(--danger); animation: shake .45s ease; }
.dial-wrap.spinning .dial-c b { opacity: .55; }
.spark { position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 2px; pointer-events: none; animation: sparkOut 1s cubic-bezier(.15,.7,.3,1) forwards; }
@keyframes sparkOut { 0% { transform: translate(0, 0) scale(.4) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(200deg); opacity: 0; } }
/* эффекты редкого выпадения: вспышка, лучи, конфетти, надпись */
.wn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; align-self: flex-start; margin-top: 7px; }
.rfx { position: fixed; inset: 0; z-index: 25; pointer-events: none; overflow: hidden; --g1: var(--c2); --g2: #FFFFFF; }
.rfx canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.rfx-flash { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--g1) 70%, transparent), transparent 70%); }
.rfx.on .rfx-flash { animation: rfxFlash 1.4s ease-out both; }
@keyframes rfxFlash { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }
.rfx-rays { position: absolute; left: 50%; top: 42%; width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax; opacity: 0;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--g1) 34%, transparent) 0deg 7deg, transparent 7deg 20deg);
  -webkit-mask: radial-gradient(circle, #000 0%, transparent 55%); mask: radial-gradient(circle, #000 0%, transparent 55%); }
.rfx.rays .rfx-rays { animation: rfxRays var(--dur, 2.4s) ease-out both; }
@keyframes rfxRays { 0% { opacity: 0; transform: rotate(0) scale(.6); } 15% { opacity: 1; } 75% { opacity: .8; } 100% { opacity: 0; transform: rotate(70deg) scale(1.1); } }
.rfx-banner { position: absolute; left: 0; right: 0; top: 30%; display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: 0; text-align: center; padding: 0 16px; }
.rfx-banner::before { content: ''; position: absolute; left: 50%; top: 50%; width: 120%; height: 230%; transform: translate(-50%, -50%); z-index: -1;
  background: radial-gradient(closest-side, rgba(0,0,0,.55), transparent); }
.rfx-banner b { font-size: clamp(28px, 9vw, 44px); font-weight: 900; letter-spacing: .02em; line-height: 1; text-transform: uppercase;
  background: linear-gradient(100deg, var(--g1), var(--g2), var(--g1)); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 4px 18px color-mix(in srgb, var(--g1) 70%, transparent)); animation: flow 1.6s linear infinite; }
.rfx-banner span { font-weight: 700; font-size: 15px; color: #fff; background: color-mix(in srgb, var(--g1) 75%, #000); padding: 5px 12px; border-radius: 20px; }
.rfx.on .rfx-banner { animation: rfxBanner var(--dur, 2.4s) cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes rfxBanner { 0% { opacity: 0; transform: scale(.3) rotate(-6deg); } 14% { opacity: 1; transform: scale(1.12) rotate(2deg); } 22% { transform: scale(1) rotate(0); } 82% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.06) translateY(-18px); } }
.app.shake { animation: rfxShake .55s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes rfxShake { 10%, 90% { transform: translate(-2px, 1px); } 20%, 80% { transform: translate(4px, -2px); } 30%, 50%, 70% { transform: translate(-7px, 3px); } 40%, 60% { transform: translate(7px, -3px); } }
.rfx.t6 .rfx-flash { background: repeating-linear-gradient(0deg, rgba(255,255,255,.18) 0 2px, transparent 2px 5px), radial-gradient(circle at 50% 42%, rgba(0,0,0,.8), transparent 75%); }
.upg-mult { background: var(--bg-2); border-radius: 16px; padding: 12px 14px 10px; }
.um-top { display: flex; justify-content: space-between; align-items: baseline; color: var(--hint); font-size: 13px; }
.um-top b { color: var(--text); font-size: 20px; }
.um-range { width: 100%; margin: 10px 0 8px; accent-color: var(--accent); height: 28px; }
.um-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.um-chips button { flex: 1 0 auto; height: 32px; padding: 0 10px; border-radius: 10px; background: var(--bg); font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--hint); }

.upg-prize { margin-top: 10px; background: var(--bg-2); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; border: 1.5px solid transparent; }
.upg-prize.tier1 { border-color: var(--c1); } .upg-prize.tier2 { border-color: var(--c2); } .upg-prize.tier3 { border-color: var(--c3); }
.upg-prize.tier4 { border-color: var(--c4); } .upg-prize.tier5 { border-color: var(--c5); }

.upg-prize .up-r { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--hint); }
.upg-prize .link-btn { color: var(--accent); font-weight: 600; font-size: 13.5px; }
.mseg { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: var(--bg-2); border-radius: 14px; padding: 3px; }
.mseg-thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 6); border-radius: 11px; background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.14), 0 0 0 .5px var(--line);
  transform: translateX(calc(var(--i, 1) * 100%)); transition: transform .35s cubic-bezier(.2,.85,.2,1); }

  font-family: var(--mono); font-size: 13.5px; font-weight: 600; color: var(--hint); transition: color .2s; }

.upg-stats { display: grid; grid-template-columns: 1fr 34px 1fr; align-items: stretch; gap: 6px; margin-top: 12px; }
.us { background: var(--bg-2); border-radius: 14px; padding: 11px 13px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.us > span:first-child { color: var(--hint); font-size: 12px; }
.us b { font-size: 18px; font-weight: 600; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.us small { color: var(--hint); font-size: 11.5px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.us small .td { font-size: 11px; }
.us.tgt { text-align: right; align-items: flex-end; }

<script>
(function () {
  'use strict';
  var E = window.FHEngine, G = window.FHGame;
  var COST = E.CONFIG.issueCost;
  var KEY = 'fh-v5'; // семь редкостей и новые регионы — прогресс начинается заново, настройки переносятся
  var tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var nf = new Intl.NumberFormat('ru-RU');
  function money(n) { return nf.format(Math.round(n)) + ' ₽'; }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ---------------- флаги (упрощённые, рисуются кодом) ---------------- */
  function stripes(colors, weights, vertical) {
    var w = weights || colors.map(function () { return 1; }), sum = w.reduce(function (a, b) { return a + b; }, 0), at = 0, out = '';
    colors.forEach(function (c, i) {
      var size = w[i] / sum * (vertical ? 20 : 14);
      out += vertical ? '<rect x="' + at.toFixed(2) + '" width="' + (size + .05).toFixed(2) + '" height="14" fill="' + c + '"/>'
                      : '<rect y="' + at.toFixed(2) + '" width="20" height="' + (size + .05).toFixed(2) + '" fill="' + c + '"/>';
      at += size;
    });
    return out;
  }
  function nordic(bg, cross, inner) {
    var s = '<rect width="20" height="14" fill="' + bg + '"/><rect x="5.5" width="3" height="14" fill="' + cross + '"/><rect y="5.5" width="20" height="3" fill="' + cross + '"/>';
    if (inner) s += '<rect x="6.3" width="1.4" height="14" fill="' + inner + '"/><rect y="6.3" width="20" height="1.4" fill="' + inner + '"/>';
    return s;
  }
  function star5(cx, cy, r, rot) {
    var pts = [];
    for (var i = 0; i < 10; i++) {
      var a = (rot || 0) + Math.PI * i / 5 - Math.PI / 2, rr = i % 2 ? r * 0.4 : r;
      pts.push((cx + rr * Math.cos(a)).toFixed(2) + ',' + (cy + rr * Math.sin(a)).toFixed(2));
    }
    return '<polygon points="' + pts.join(' ') + '" fill="#FFDE00"/>';
  }
  var FLAG = {
    ru: stripes(['#fff', '#1C57A7', '#D52B1E']),
    jp: '<rect width="20" height="14" fill="#fff"/><circle cx="10" cy="7" r="4.2" fill="#BC002D"/>',
    de: stripes(['#111', '#DD0000', '#FFCE00']),
    us: '<rect width="20" height="14" fill="#fff"/><g fill="#C9283E"><rect width="20" height="2"/><rect y="4" width="20" height="2"/><rect y="8" width="20" height="2"/><rect y="12" width="20" height="2"/></g><rect width="9" height="7.5" fill="#3C3B6E"/>',
    kz: '<rect width="20" height="14" fill="#00AFCA"/><circle cx="10.5" cy="6.2" r="2.6" fill="#FEC50C"/><path d="M7 10.2q3.5 1.6 7 0" stroke="#FEC50C" stroke-width="1" fill="none"/><rect x="1.4" y="1" width="1.1" height="12" fill="#FEC50C"/>',
    th: stripes(['#A51931', '#F4F5F8', '#2D2A4A', '#F4F5F8', '#A51931'], [1, 1, 2, 1, 1]),
    ae: stripes(['#00732F', '#fff', '#111']) + '<rect width="5.4" height="14" fill="#FF0000"/>',
    cn: '<rect width="20" height="14" fill="#EE1C25"/>' + star5(3.4, 3.5, 2.1) + star5(6.7, 1.4, .75, .5) + star5(8, 2.8, .75, .9) + star5(8, 4.9, .75, 0) + star5(6.7, 6.3, .75, .4),
    se: nordic('#006AA7', '#FECC02'),
    ch: '<rect width="20" height="14" fill="#DA291C"/><rect x="8.6" y="2.8" width="2.8" height="8.4" fill="#fff"/><rect x="5.8" y="5.6" width="8.4" height="2.8" fill="#fff"/>',
    // «Любые номера»: четыре цвета — значит, страна выпадет случайно
    any: '<defs><linearGradient id="anyG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F8BFF"/><stop offset="1" stop-color="#8A5CF5"/></linearGradient></defs><rect width="20" height="14" fill="url(#anyG)"/>' +
      '<g fill="none" stroke="#fff" stroke-width=".95" stroke-linecap="round"><circle cx="10" cy="7" r="4.6"/><ellipse cx="10" cy="7" rx="1.9" ry="4.6"/><path d="M5.4 7h9.2M6.1 4.7h7.8M6.1 9.3h7.8"/></g>' +
      '<path d="M16.6 2.2l.5 1.2 1.2.5-1.2.5-.5 1.2-.5-1.2-1.2-.5 1.2-.5z" fill="#fff"/>'
  };
  function badgeSvg(b, cls) {
    var t = String(b.t || '?').slice(0, 3), ink = inkFor(b.bg || '#2A2D31');
    return '<svg class="flag' + (cls ? ' ' + cls : '') + '" viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" fill="' + (b.bg || '#2A2D31') + '"/>' +
      '<text x="10" y="9.6" text-anchor="middle" font-family="Martian Mono, ui-monospace, monospace" font-weight="700" font-size="' + (t.length > 2 ? 5.6 : t.length > 1 ? 7 : 8.5) + '" fill="' + ink + '">' + esc(t) + '</text></svg>';
  }
  function flagSvg(key, cls) {
    var c = COUNTRIES[key];
    if (c && c.badge) return badgeSvg(c.badge, cls);
    return '<svg class="flag' + (cls ? ' ' + cls : '') + '" viewBox="0 0 20 14" aria-hidden="true">' + (FLAG[key] || '') + '</svg>';
  }

  // Проверка формы и живой предпросмотр.
  function readOp(countryKey) {
    var code = val('oCode'), name = val('oName'), errors = [], warns = [];
    if (!/^\d{3}$/.test(code)) errors.push('Код оператора — ровно 3 цифры.');
    if (!name) errors.push('Укажите название оператора.');
    var c = countryKey && COUNTRIES[countryKey];
    if (c && c.nets.some(function (n) { return n[0] === code; })) errors.push('В этом регионе уже есть оператор с кодом ' + code + '.');
    var safe = '0';
    if (/^\d{3}$/.test(code) && code.charAt(0) !== safe) warns.push('С кодом на «' + code.charAt(0) + '» номер может совпасть с настоящим. Чтобы позвонить было нельзя, начните код с ' + safe + '.');
    return { op: [code, name || 'Оператор', radio('oMark') || 'bars', radio('oColor') || SWATCHES[0], radio('oShape') || 'sq'], errors: errors, warns: warns };
  }
  function readRegion() {
    var name = val('rName'), code = val('rCode'), f = (radio('rFmt') || '3,2,2|-').split('|'), errors = [], warns = [];
    if (!name) errors.push('Укажите название региона.');
    if (!/^\d{1,4}$/.test(code)) errors.push('Код страны — от 1 до 4 цифр.');
    var same = COUNTRY_LIST.filter(function (c) { return c[2] === code; }).map(function (c) { return c[1]; });
    if (same.length) warns.push('Код +' + code + ' уже у: ' + same.join(', ') + '. Номера будут выглядеть как из этой страны.');
    return { name: name, code: code, groups: f[0].split(',').map(Number), sep: f[1], badge: { t: val('rBadge') || code.slice(0, 3) || '?', bg: radio('rColor') || SWATCHES[0] }, errors: errors, warns: warns };
  }
  function preview() {
    var form = document.querySelector('[data-form]'); if (!form) return;
    var kind = form.getAttribute('data-form'), html = '', errs = [], warns = [];
    var sample = '5533355';
    function fmt(groups, sep) { var o = [], p = 0; groups.forEach(function (n) { o.push(sample.slice(p, p + n)); p += n; }); return o.join(sep); }
    if (kind === 'region') {
      var r = readRegion(); errs = r.errors; warns = r.warns;
      var key = form.getAttribute('data-key');
      var op = key ? (S.custom.regions.filter(function (x) { return x.key === key; })[0] || { nets: [['000', '', 'bars', '#2A2D31', 'sq']] }).nets[0] : null;
      if (!key) { var o = readOp(null); op = o.op; errs = errs.concat(o.errors); warns = warns.concat(o.warns); }
      html = '<span class="pv-flag">' + badgeSvg(r.badge, 'lg') + '</span><span class="t"><b>' + esc(r.name || 'Регион') + '</b><small class="mono">' + logoHtml(op, 'sm') + ' +' + esc(r.code || '___') + ' (' + esc(op[0]) + ') ' + fmt(r.groups, r.sep) + '</small></span>';
    } else {
      var ck = val('oCountry'), c = countryOf(ck), oo = readOp(ck); errs = oo.errors; warns = oo.warns;
      html = '<span class="pv-flag">' + logoHtml(oo.op, 'md') + '</span><span class="t"><b>' + esc(oo.op[1]) + '</b><small class="mono">+' + esc(c.code) + ' (' + esc(oo.op[0]) + ') ' + fmt(c.groups, c.sep) + '</small></span>';
    }
    $('pv').innerHTML = html;
    $('msg').innerHTML = errs.map(function (m) { return '<span class="err">' + esc(m) + '</span>'; }).concat(warns.map(function (m) { return '<span class="warn">' + esc(m) + '</span>'; })).join('');
    return errs.length === 0;
  }

  // оценка зависит только от цифр — кэшируем, чтобы склад на 1000 номеров открывался быстро

  // ----- страница номера: тап по цифре → «Прокрутить» → выпадает случайная цифра

      '<div class="rr-leg"><span><i class="u"></i>дороже <b>' + pctLabel(q.pUp) + '</b></span><span><i class="s"></i>так же <b>' + pctLabel(q.pSame) + '</b></span><span><i class="d"></i>дешевле <b>' + pctLabel(q.pDown) + '</b></span></div>' +
      (rr.last && !rr.busy ? '<p class="rr-res ' + rr.last.kind + '">' + esc(rr.last.text) + '</p>' : '') +

      (rr.busy ? 'Крутим…' : S.balance < q.fee ? 'Не хватает: нужно ' + money(q.fee) : (rr.last ? 'Ещё раз · ' : 'Крутить · ') + money(q.fee)) + '</button>' +

  function openReroll(id, pos) { rr = { id: id, pos: pos, busy: false, last: null }; openSheet(rerollHtml()); }
  function rerollOpen() { return open && !!$('sheetBody').querySelector('.rr-num'); }
  function rerollRender() { if (rerollOpen()) $('sheetBody').innerHTML = rerollHtml(); }
  function rrTry() {
    var item = findItem(rr.id); if (!item || rr.pos === null || rr.busy) return;
    var q = E.rerollQuote(item.d, rr.pos);

    var pos = rr.pos, d = Number(item.d.charAt(pos)), was = priceLabel(evOf(item)), wasSecret = isSecret(evOf(item));
    rr.busy = true; rr.last = null; rerollRender(); audio();
    var el = $('sheetBody').querySelector('.rr-d[data-rpos="' + pos + '"]'), stop = false, timer = 0, n = 0;
    // цифра щёлкает сразу, пока сервер решает, что выпало
    (function pre() { if (stop) return; d = (d + 1) % 10; if (el) flip(el, String(d), 55); if (n++ % 3 === 0) flapTick(); timer = setTimeout(pre, 55); })();
    run('reroll', { id: item.id, pos: pos }).then(function (res) {

          : 'Выпала ' + res.digit + ' — цена не изменилась.' };
      if (res.outcome === 'up') { buzz('win'); chime(Math.max(2, ev1.tier)); } else buzz(res.outcome === 'down' ? 'hard' : 'soft');
      tick(true);
      if (pages.length && pages[pages.length - 1].name === 'num') { var y = $('page').scrollTop; replacePage('num', res.id); $('page').scrollTop = y; }
      if (rerollOpen()) rerollRender(); else toast(rr.last.text);
    }

  // ----- апгрейдер: ставишь до 10 номеров и выбираешь цель — конкретный номер с точной ценой.
  // Шанс = 80% × ставка / цена цели (не больше 90%): какой показан, такой и есть — сервер считает так же.
  var MULTS = [1.5, 2, 3, 5, 10, 20, 50], M_MIN = 1.2, M_MAX = 100, RR_UP = 96, RING = 2 * Math.PI * RR_UP;
  var upg = { ids: [], m: 2, busy: false, last: null, angle: 0, more: 150, prize: null };
  function mToRange(m) { return Math.round(1000 * Math.log(m / M_MIN) / Math.log(M_MAX / M_MIN)); }
  function rangeToM(v) { return M_MIN * Math.pow(M_MAX / M_MIN, v / 1000); }
  function pctReal(p) { var v = p * 100; return (v >= 10 ? v.toFixed(1) : v >= 1 ? v.toFixed(2) : v.toFixed(3)).replace('.', ',') + '%'; }
  function multLabel(m) { return '×' + (m >= 10 ? String(Math.round(m)) : (Math.round(m * 10) / 10).toFixed(1).replace('.', ',')); }
  // цель для текущей ставки и множителя — один раз на сочетание, «Другой номер» подбирает новую
  function upgPrize(stake, fresh) {

  });

  function boot() {
    rebuildCountries(); $('brandMark').innerHTML = logoHtml(APP_OP) + '<span class="hat" id="hat"></span>'; loadAvatar(); applyHoliday();
    shown = S.balance; renderBalance(false); renderLevel(); renderPity(); renderCountry(); renderDot(); renderPills(); renderMain();
    var last = S.last && S.items.filter(function (x) { return x.id === S.last; })[0];
    hide();
    if (last) {
      var ev = E.evaluate(last.d);
      reels.forEach(function (r, i) { r.pos = Number(last.d.charAt(i)); setPos(r, r.pos, 0); });
      setCard(last); current = { item: last, ev: ev };
      show(last, ev, true); fillResult(ev, false); setResult('main');
    } else {
      reels.forEach(function (r) { r.pos = 0; setPos(r, 0, 0); });
      setCard(null); setRun(0); $('sim').dataset.tier = '0';
      $('digits').classList.add('idle'); setResult('intro');
    }
  }
  boot();
  connect().then(afterConnect);
})();
</script>
